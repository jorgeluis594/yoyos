name: WhatsApp native bridge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.5.1'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: false
          cache-dependency-path: apps/mobile/modules/whatsapp/go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK parts
        run: |
          test -d "$ANDROID_HOME/cmdline-tools"
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Prepare pinned Go dependencies
        run: sh scripts/prepare-go-dependencies.sh
        working-directory: apps/mobile/modules/whatsapp
      - run: go test -race ./bridge
        working-directory: apps/mobile/modules/whatsapp/go
      - run: go vet ./bridge
        working-directory: apps/mobile/modules/whatsapp/go
      - run: sh scripts/test-build-go-cleanup.sh
        working-directory: apps/mobile/modules/whatsapp
      - run: sh scripts/test-check-android-probe.sh
        working-directory: apps/mobile/modules/whatsapp
      - run: sh scripts/build-go.sh android
        working-directory: apps/mobile/modules/whatsapp
      - name: Link WhatsApp into isolated Expo probe app
        run: |
          ln -s ../../node_modules tests/whatsapp-native-app/node_modules
          mkdir -p tests/whatsapp-native-app/modules
          ln -s ../../../modules/whatsapp tests/whatsapp-native-app/modules/whatsapp
        working-directory: apps/mobile
      - run: pnpm exec expo prebuild tests/whatsapp-native-app --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew :app:assembleRelease
        working-directory: apps/mobile/tests/whatsapp-native-app/android
      - name: Record effective Android matrix
        run: |
          cat > "$RUNNER_TEMP/whatsapp-matrix.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
            [':app', ':yoyos-whatsapp'].each { name ->
              def project = gradle.rootProject.findProject(name)
              if (project != null) {
                def android = project.extensions.getByName('android')
                println("${name}: compileSdk=${android.compileSdkVersion}, buildTools=${android.buildToolsVersion}, ndk=${android.ndkVersion}, minSdk=${android.defaultConfig.minSdkVersion?.apiLevel}, targetSdk=${android.defaultConfig.targetSdkVersion?.apiLevel}, abiFilters=${android.defaultConfig.ndk.abiFilters}")
              }
            }
          }
          GRADLE
          {
            java -version 2>&1
            ./gradlew --version
            ./gradlew -q -I "$RUNNER_TEMP/whatsapp-matrix.gradle" help
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^(sdkVersion|targetSdkVersion|native-code):"
            unzip -Z1 app/build/outputs/apk/release/app-release.apk | awk -F/ '$1 == "lib" { print $2 }' | sort -u
          } >> ../../../modules/whatsapp/.generated/build-info.txt
        working-directory: apps/mobile/tests/whatsapp-native-app/android
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/mobile/tests/whatsapp-native-app/android
          script: sh ../../../modules/whatsapp/scripts/check-android-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-android-build-info
          path: apps/mobile/modules/whatsapp/.generated/build-info.txt

  ios:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.5.1'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: false
          cache-dependency-path: apps/mobile/modules/whatsapp/go/go.sum
      - name: Select full Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          pod --version
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Prepare pinned Go dependencies
        run: sh scripts/prepare-go-dependencies.sh
        working-directory: apps/mobile/modules/whatsapp
      - run: go test ./bridge
        working-directory: apps/mobile/modules/whatsapp/go
      - run: sh scripts/test-build-go-cleanup.sh
        working-directory: apps/mobile/modules/whatsapp
      - run: sh scripts/build-go.sh ios
        working-directory: apps/mobile/modules/whatsapp
      - name: Link WhatsApp into isolated Expo probe app
        run: |
          ln -s ../../node_modules tests/whatsapp-native-app/node_modules
          mkdir -p tests/whatsapp-native-app/modules
          ln -s ../../../modules/whatsapp tests/whatsapp-native-app/modules/whatsapp
        working-directory: apps/mobile
      - run: pnpm exec expo prebuild tests/whatsapp-native-app --platform ios --no-install
        working-directory: apps/mobile
      - run: pod install
        working-directory: apps/mobile/tests/whatsapp-native-app/ios
      - name: Record effective iOS matrix
        run: |
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphonesimulator --show-sdk-version
            pod --version
          } >> ../../../modules/whatsapp/.generated/build-info.txt
        working-directory: apps/mobile/tests/whatsapp-native-app/ios
      - name: Boot available simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list -j devices available | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test callback on simulator
        run: |
          scheme=$(xcodebuild -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); schemes=next(v["schemes"] for v in data.values() if isinstance(v,dict) and "schemes" in v); print(next(s for s in schemes if "WhatsAppBridgeTests" in s))')
          xcodebuild -scheme "$scheme" -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -skip-testing:WhatsAppBridgeTests/StateStoreTests/testProcessCrashMatrix test
        working-directory: apps/mobile/modules/whatsapp/ios
      - name: Build Expo app with the vendored framework
        run: |
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          xcodebuild -workspace "$workspace" -scheme WhatsAppNativeProbe -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -showBuildSettings | grep -E '^[[:space:]]*(ARCHS|SDKROOT|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION) = ' | sort -u >> ../../../modules/whatsapp/.generated/build-info.txt
          xcodebuild -workspace "$workspace" -scheme WhatsAppNativeProbe -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/wa-app" CODE_SIGNING_ALLOWED=NO build
          app=$(find "$RUNNER_TEMP/wa-app/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          lipo -archs "$app/$executable" >> ../../../modules/whatsapp/.generated/build-info.txt
          xcrun vtool -show-build "$app/$executable" >> ../../../modules/whatsapp/.generated/build-info.txt
          xcrun simctl install "$SIMULATOR_ID" "$app"
          xcrun simctl launch "$SIMULATOR_ID" com.yoyos.whatsappnativeprobe
          sleep 15
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/whatsapp-probe.png"
          swift ../../../modules/whatsapp/scripts/check-probe-screenshot.swift "$RUNNER_TEMP/whatsapp-probe.png"
        working-directory: apps/mobile/tests/whatsapp-native-app/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-ios-build-info-${{ matrix.runner }}
          path: apps/mobile/modules/whatsapp/.generated/build-info.txt
