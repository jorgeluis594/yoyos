services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  db_test:
    image: postgres:18-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${CORE_TEST_PORT:-55433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  migrate:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    command: sh -c 'pnpm exec prisma migrate deploy && psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$$APP_DB_PASSWORD" -v dbname=core -f scripts/provision-role.sql'
    environment:
      DATABASE_URL: postgresql://core:core@db:5432/core
      APP_DB_PASSWORD: core_app_local
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    command: sh -c "pnpm --dir /workspace/shared install --frozen-lockfile && pnpm exec prisma generate && pnpm dev"
    env_file:
      - ./apps/core/.env
    environment:
      DATABASE_URL: postgresql://core_app:core_app_local@db:5432/core
      BETTER_AUTH_SECRET: local-development-secret-change-me-32chars
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-Yoyos <cuentas@yoyos.test>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: mailpit
      SMTP_PORT: ${SMTP_PORT:-1025}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      WHATSAPP_CONNECTIONS_JSON: "${WHATSAPP_CONNECTIONS_JSON:-[]}"
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/core:/workspace/apps/core
      - /workspace/apps/core/node_modules
      - ./shared:/workspace/shared
      - /workspace/shared/node_modules
      - ./docs:/workspace/docs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    command: sh -c "pnpm --dir /workspace/shared install --frozen-lockfile && pnpm exec prisma generate && exec ./node_modules/.bin/tsx src/worker.ts"
    stop_grace_period: 40s
    env_file:
      - ./apps/core/.env
    environment:
      DATABASE_URL: postgresql://core_app:core_app_local@db:5432/core
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./apps/core:/workspace/apps/core
      - /workspace/apps/core/node_modules
      - ./shared:/workspace/shared
      - /workspace/shared/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  postgres_test_data:
