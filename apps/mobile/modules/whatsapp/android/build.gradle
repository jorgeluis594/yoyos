plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def bindingsDir = file('libs')
def bindings = file('libs/WhatsAppGo.aar')
if (!bindings.isFile()) {
  throw new GradleException('WhatsAppGo.aar is missing; run modules/whatsapp/scripts/build-go.sh android before Gradle')
}
rootProject.allprojects {
  repositories { flatDir { dirs bindingsDir } }
}

dependencies {
  implementation(name: 'WhatsAppGo', ext: 'aar')
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
}

group = 'expo.modules.whatsapp'
version = '0.1.0'

android {
  namespace 'expo.modules.whatsapp'
  compileSdkVersion 36
  buildToolsVersion '36.0.0'
  ndkVersion '27.1.12297006'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
    ndk { abiFilters 'arm64-v8a', 'x86_64' }
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
}
