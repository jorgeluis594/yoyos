services:
  db:
    image: pgvector/pgvector:0.8.1-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    restart: "no"
    command: sh -c 'case "$$CATALOG_BASE_URL" in https://*) ;; *) echo "CATALOG_BASE_URL must be an https URL" >&2; exit 1;; esac && psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$$APP_DB_PASSWORD" -f scripts/create-role.sql && pnpm exec tsx scripts/migrate.ts && psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$$APP_DB_PASSWORD" -v dbname=core -f scripts/provision-role.sql'
    environment:
      DATABASE_URL: postgresql://core:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/core
      APP_DB_PASSWORD: ${SERVICE_PASSWORD_64_APPDB}
      # Guarded by the command above: Coolify stores the :? error text as the literal value, so interpolation alone never refuses the deploy.
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:?CATALOG_BASE_URL is required}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    restart: unless-stopped
    command: pnpm start
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://core_app:${SERVICE_PASSWORD_64_APPDB}@db:5432/core
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://app.yoyos.lat}
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:?CATALOG_BASE_URL is required}
      EMAIL_TRANSPORT: resend
      EMAIL_FROM: ${EMAIL_FROM:-Yoyos <cuentas@kogozstaging.lat>}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set the Resend API key in Coolify}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    healthcheck:
      # node:24-slim has no curl or wget.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose:
      - "3000"
    labels:
      # Brand hosts (*.yoyos.lat) reach core through explicit routers with the Cloudflare Origin CA certificate; see README.md, Catalog brand hosts.
      - "traefik.http.routers.yoyos-stores.rule=HostRegexp(`^[a-z0-9-]+\\.yoyos\\.lat$$`)"
      - "traefik.http.routers.yoyos-stores.entrypoints=https"
      - "traefik.http.routers.yoyos-stores.tls=true"
      - "traefik.http.routers.yoyos-stores.priority=1"
      - "traefik.http.routers.yoyos-stores.service=yoyos-stores"
      - "traefik.http.routers.yoyos-stores-http.rule=HostRegexp(`^[a-z0-9-]+\\.yoyos\\.lat$$`)"
      - "traefik.http.routers.yoyos-stores-http.entrypoints=http"
      - "traefik.http.routers.yoyos-stores-http.priority=1"
      - "traefik.http.routers.yoyos-stores-http.middlewares=yoyos-stores-https"
      - "traefik.http.routers.yoyos-stores-http.service=yoyos-stores"
      - "traefik.http.middlewares.yoyos-stores-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.yoyos-stores-https.redirectscheme.permanent=true"
      - "traefik.http.services.yoyos-stores.loadbalancer.server.port=3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    restart: unless-stopped
    command: pnpm worker
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://core_app:${SERVICE_PASSWORD_64_APPDB}@db:5432/core
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PRODUCT_MATCHER_PROVIDER: ${PRODUCT_MATCHER_PROVIDER:-openai}
      PRODUCT_MATCHER_MODEL: ${PRODUCT_MATCHER_MODEL:-gpt-6-luna}
      IMAGE_EMBEDDER_PROVIDER: ${IMAGE_EMBEDDER_PROVIDER:-local}
      IMAGE_EMBEDDER_MODEL: ${IMAGE_EMBEDDER_MODEL:-}
      IMAGE_DESCRIBE_MODEL: ${IMAGE_DESCRIBE_MODEL:-gpt-6-luna}
      PRODUCT_MATCH_CANDIDATES: ${PRODUCT_MATCH_CANDIDATES:-5}
      PRODUCT_MATCH_MIN_CONFIDENCE: ${PRODUCT_MATCH_MIN_CONFIDENCE:-0.8}
      PRODUCT_MATCH_TIMEOUT_MS: ${PRODUCT_MATCH_TIMEOUT_MS:-20000}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
