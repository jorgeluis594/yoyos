<!doctype html><html lang="es"><head><meta charset="utf-8"><title>a3-color-dialog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:20px 28px 18px;border-bottom:1px solid var(--border)}
.ph .acts{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ph .acts .row{display:flex;align-items:center;gap:8px}
.work{flex:1;display:flex;min-height:0}
.canvas{flex:1;background:var(--background);display:flex;flex-direction:column;min-width:0}
.tb{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border)}
.stage{flex:1;display:grid;place-items:start center;padding-top:22px;overflow:hidden}
.insp{width:372px;flex:none;border-left:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.sec{padding:18px 22px;border-bottom:1px solid var(--border)}
.sec .h2{margin-bottom:4px}
.swrow{display:flex;gap:8px;margin-top:10px}
.swrow .sw{width:28px;height:28px;border-radius:6px}
.swrow .sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--foreground)}
.bgopt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bgopt div{position:relative;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;font-weight:500;display:flex;flex-direction:column;gap:6px}
.bgopt div.on{border:1.5px solid var(--primary);background:var(--accent);color:var(--accent-fg)}
.bgopt i{display:block;height:34px;border-radius:5px;border:1px solid var(--border)}
.derived{display:flex;flex-wrap:wrap;gap:6px 14px;white-space:nowrap;margin-top:10px;font-size:12px;color:var(--muted-fg)}
.derived span{display:flex;align-items:center;gap:6px}
.derived .sw{width:14px;height:14px;border-radius:3px}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pal{position:relative;border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500}
.pal em{font-style:normal;color:var(--muted-fg);font-weight:400}
.pal.on{border:1.5px solid var(--foreground);box-shadow:0 0 0 3px var(--secondary)}
.pal .chip{display:flex;height:30px;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.pal .chip i{display:grid;place-items:center}
.pal .chip i:nth-child(1){flex:2}.pal .chip i:nth-child(2){flex:1}.pal .chip i:nth-child(3){flex:1}
.pal .chip b{width:10px;height:10px;border-radius:50%;display:block}
.pal u{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--foreground);color:#fff;display:grid;place-items:center;text-decoration:none}
.selrow{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--background)}
.selrow .sw{width:28px;height:28px;border-radius:6px}
.tick{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center}
.sec{padding:16px 22px}
.pal{padding:5px;gap:4px}.pal .chip{height:28px}
.legend{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--muted-fg);white-space:nowrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1)}
.legend i b{width:6px;height:6px;border-radius:50%}
.bgseg{display:flex;width:100%}.bgseg span{flex:1;justify-content:center;white-space:nowrap;padding:0 6px;gap:5px}
.bgseg i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15);display:block}
.colorbtn{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border:1px solid var(--input);border-radius:8px;cursor:pointer}
.colorbtn.focus{outline:2px solid var(--primary);outline-offset:2px}
.colorbtn .chip{display:flex;width:72px;height:32px;border-radius:6px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.colorbtn .chip i{display:grid;place-items:center}.colorbtn .chip i:nth-child(1){flex:2}.colorbtn .chip i:nth-child(2),.colorbtn .chip i:nth-child(3){flex:1}
.colorbtn .chip b{width:9px;height:9px;border-radius:50%;display:block}
.scrim{position:fixed;inset:0;background:rgb(36 35 38 / .42)}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:760px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgb(0 0 0 / .16)}
.dh{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:20px 24px 4px}
.dh .x{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--muted-fg)}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 24px 20px}
.dpal{position:relative;border:1px solid var(--border);border-radius:10px;padding:8px}
.dpal.on{border:1.5px solid var(--foreground);box-shadow:0 0 0 3px var(--secondary)}
.dpal u{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--foreground);color:#fff;display:grid;place-items:center;text-decoration:none;z-index:1}
.dchip{display:flex;border-radius:6px;overflow:hidden;height:60px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}
.dchip>div{flex:1;display:grid;place-items:center}
.dchip span{font-size:11px;font-weight:600;color:#fff;padding:5px 10px;border-radius:5px}
.dn{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 0}
.dn b{font-weight:600}.dn em{font-style:normal;font-size:12px;color:var(--muted-fg)}
.df{display:flex;align-items:center;gap:8px;padding:14px 24px;border-top:1px solid var(--border)}
.colorbtn .one{width:36px;height:36px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1)}
.blk{height:64px;border-radius:6px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.dgrid{gap:12px}
</style></head><body><div class="app" id="app"></div><script>const DARK=false;const DIALOG=true;</script><script src="a-palettes.js"></script></body></html>
